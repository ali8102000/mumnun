name: Upgrade Expo app to SDK 58

on:
  push:
    branches:
      - upgrade/platform-hardening-2026-11-20
    paths:
      - ".github/workflows/upgrade-expo-sdk.yml"
      - "expo-app/app.config.ts"
      - "expo-app/app.json"
      - "expo-app/app/request/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mamnoon-expo-sdk-upgrade
  cancel-in-progress: false

jobs:
  upgrade-and-verify:
    name: Upgrade Expo SDK and verify Android
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      APP_ENV: production
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
      EAS_PROJECT_ID: ${{ vars.EAS_PROJECT_ID || secrets.EAS_PROJECT_ID }}
    defaults:
      run:
        working-directory: expo-app
    steps:
      - name: Checkout upgrade branch
        uses: actions/checkout@v7
        with:
          ref: upgrade/platform-hardening-2026-11-20
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: latest

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate production build configuration
        shell: bash
        run: |
          missing=()
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY EXPO_PUBLIC_GOOGLE_MAPS_API_KEY EAS_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then missing+=("$name"); fi
          done
          if (( ${#missing[@]} )); then
            printf 'Missing GitHub Actions variables/secrets: %s\\n' "${missing[*]}"
            exit 1
          fi
          [[ "$EXPO_PUBLIC_SUPABASE_URL" == https://* ]] || { echo "Supabase URL must use HTTPS."; exit 1; }
          [[ "$EAS_PROJECT_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-8][0-9a-fA-F]{3}-[89abAB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$ ]] || { echo "EAS_PROJECT_ID must be a UUID."; exit 1; }

      - name: Install current locked dependencies
        run: bun install --frozen-lockfile

      - name: Upgrade Expo to SDK 58
        run: |
          bun add expo@^58.0.0
          bunx expo install --fix

      - name: Install required Reanimated worklets peer dependency
        run: bunx expo install react-native-worklets

      - name: Install SDK 58 splash screen plugin
        run: bunx expo install expo-splash-screen

      - name: Validate Expo dependency compatibility
        run: bunx expo-doctor

      - name: TypeScript validation
        run: bunx tsc --noEmit

      - name: Export Android JavaScript bundle
        run: bunx expo export --platform android

      - name: Generate Android native project
        run: bunx expo prebuild --platform android --no-install

      - name: Verify resolved production Expo configuration
        run: |
          bunx expo config --type public --json > /tmp/mamnoon-expo-config.json
          node <<'NODE'
          const fs = require('node:fs');
          const raw = require('/tmp/mamnoon-expo-config.json');
          const config = raw.expo ?? raw;
          const extra = config.extra ?? {};
          const manifestPath = 'android/app/src/main/AndroidManifest.xml';
          const manifest = fs.readFileSync(manifestPath, 'utf8');
          const mapTag = manifest.match(/<meta-data\b[^>]*android:name=["']com\.google\.android\.geo\.API_KEY["'][^>]*>/);
          const mapValue = mapTag?.[0].match(/android:value=["']([^"']+)["']/)?.[1];
          const checks = {
            supabaseUrl: Boolean(extra.supabaseUrl),
            supabasePublishableKey: Boolean(extra.supabasePublishableKey),
            easProjectId: Boolean(extra.eas?.projectId),
            androidMapsKeyInjectedIntoManifest: Boolean(
              process.env.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY &&
              mapValue === process.env.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY
            ),
          };
          console.log('Resolved Expo config shape:', raw.expo ? 'expo-wrapped' : 'root');
          console.log('Production config checks:', JSON.stringify(checks));
          const missing = Object.entries(checks).filter(([, present]) => !present).map(([name]) => name);
          if (missing.length) {
            console.error('Production Android configuration checks failed:', missing.join(', '));
            process.exit(1);
          }
          console.log('Production Expo and native Android configuration verified. Secret values were not printed.');
          NODE

      - name: Build Android release APK
        working-directory: expo-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a assembleRelease

      - name: Save upgraded dependencies to branch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          if git diff --cached --quiet; then
            echo "No dependency changes to commit."
          else
            git commit -m "chore(android): upgrade Expo app to SDK 58"
            git push origin HEAD:upgrade/platform-hardening-2026-11-20
          fi

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: expo-sdk-58-verification
          path: |
            expo-app/dist
            expo-app/android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: ignore
          retention-days: 7
