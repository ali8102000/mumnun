name: Refresh Nitro lockfile (one-time)

on:
  push:
    branches:
      - mamnoon-production-hardening-2026-11-09
    paths:
      - .github/workflows/refresh-nitro-lock.yml

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: mamnoon-production-hardening-2026-11-09
      - uses: oven-sh/setup-bun@v2
      - name: Update Nitro and regenerate Bun lockfile
        run: bun add --dev nitro@3.0.261103-rc
      - name: Verify types, build, tests, and lint
        run: |
          bunx tsc --noEmit
          bun run build
          bun run test:unit
          bun run lint
      - name: Commit verified dependency update and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git rm .github/workflows/refresh-nitro-lock.yml
          git commit -m "Upgrade Nitro and regenerate lockfile after CI verification"
          git push origin mamnoon-production-hardening-2026-11-09
