name: Android APK - GitHub Actions (No EAS)

on:
  push:
    branches:
      - main
    paths:
      - "expo-app/**"
      - ".github/workflows/android-apk-github.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mamnoon-android-apk
  cancel-in-progress: false

jobs:
  build-android-apk:
    name: Build installable Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: expo-app
    env:
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validate required app configuration
        run: |
          set -euo pipefail
          for name in EXPO_PUBLIC_SUPABASE_URL EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY EXPO_PUBLIC_GOOGLE_MAPS_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing GitHub Actions secret: $name"
              exit 1
            fi
          done

      - name: Install Expo dependencies
        run: bun install --frozen-lockfile

      - name: Generate native Android project
        run: bunx expo prebuild --platform android --no-install

      - name: Build optimized installable release APK (ARM64)
        working-directory: expo-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a assembleRelease

      - name: Verify APK
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          mkdir -p dist
          cp "$APK" dist/mamnoon-installable.apk
          sha256sum dist/mamnoon-installable.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mamnoon-release-arm64-apk
          path: expo-app/dist/mamnoon-installable.apk
          if-no-files-found: error
          retention-days: 14
