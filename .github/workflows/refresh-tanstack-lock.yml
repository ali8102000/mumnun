name: Refresh TanStack lockfile (one-time)

on:
  push:
    branches:
      - mamnoon-production-hardening-2026-11-09
    paths:
      - .github/workflows/refresh-tanstack-lock.yml
      - src/lib/api/example.functions.ts

permissions:
  contents: write

jobs:
  refresh-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: mamnoon-production-hardening-2026-11-09
      - uses: oven-sh/setup-bun@v2
      - name: Align TanStack packages and regenerate Bun lockfile
        run: bun add @tanstack/react-start@1.169.5 @tanstack/react-router@1.170.46 @tanstack/router-plugin@1.169.0
      - name: Verify web and Android builds
        run: |
          bunx tsc --noEmit
          bun run build
          bun run test:unit
          bun run lint
          bunx expo config --type public
          bunx expo export --platform android
      - name: Commit verified dependency update and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git rm .github/workflows/refresh-tanstack-lock.yml
          git commit -m "Align TanStack packages after CI verification"
          git push origin mamnoon-production-hardening-2026-11-09
